<div class="feedback-box">
  <h2>Customer Feedback</h2>
  <p>We would love to hear from you!</p>

  <!-- Alerts for API state responses -->
  <div *ngIf="successMessage" class="alert success">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="alert error">{{ errorMessage }}</div>

  <form [formGroup]="feedbackForm" (ngSubmit)="onFormSubmit()">
    
    <!-- Full Name field -->
    <div class="form-group">
      <label for="fullName">Full Name</label>
      <input id="fullName" type="text" formControlName="fullName" placeholder="John Doe" />
      <span class="text-danger" *ngIf="feedbackForm.get('fullName')?.touched && feedbackForm.get('fullName')?.hasError('required')">
        Name is required.
      </span>
    </div>

    <!-- Company Name field -->
    <div class="form-group">
      <label for="companyName">Company Name</label>
      <input id="companyName" type="text" formControlName="companyName" placeholder="Acme Corp" />
      <span class="text-danger" *ngIf="feedbackForm.get('companyName')?.touched && feedbackForm.get('companyName')?.hasError('required')">
        Company name is required.
      </span>
    </div>

    <!-- Email Address field -->
    <div class="form-group">
      <label for="emailAddress">Email Address</label>
      <input id="emailAddress" type="email" formControlName="emailAddress" placeholder="john@example.com" />
      <span class="text-danger" *ngIf="feedbackForm.get('emailAddress')?.touched && feedbackForm.get('emailAddress')?.hasError('invalid')">
        Please enter a valid email address.
      </span>
    </div>

    <!-- Feedback Type selection -->
    <div class="form-group">
      <label for="feedbackType">Feedback Type</label>
      <select id="feedbackType" formControlName="feedbackType">
        <option *ngFor="let type of feedbackTypes" [value]="type">{{ type }}</option>
      </select>
    </div>

    <!-- Message field -->
    <div class="form-group ">
      <label for="message">Your Message</label>
      <textarea id="message" formControlName="message" rows="4" placeholder="Type your details here..."></textarea>
      <span class="text-danger" *ngIf="feedbackForm.get('message')?.touched && feedbackForm.get('message')?.hasError('required')">
        Message details cannot be left blank.
      </span>
    </div>

    <!-- Submit Button logic -->
    <button type="submit" [disabled]="feedbackForm.invalid || isSubmitting">
      {{ isSubmitting ? 'Sending...' : 'Submit Feedback' }}
    </button>

    <!-- Back to Home Button -->
    <button type="button" (click)="goHome()" class="btn-back">
      Back to Home
    </button>

  </form>
</div>
