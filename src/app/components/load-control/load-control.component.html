<section class="load-control-page">

  <div class="container">

    <div class="header">
      <h1>Load Control</h1>

      <p>
        Our load planners ensure the safe departure of aircraft with maximum payload.
      </p>

      <div class="back-button">
        <button routerLink="/" class="btn-home">
          ← Back to Home
        </button>
      </div>
    </div>

    <div class="content">

      <div class="image-section">
        <img
          src="assets/our-customers/loading.jpg"
          alt="Load Control">
      </div>

      <div class="text-section">

        <h3>Our Services Include</h3>

        <ul>
          <li *ngFor="let service of services">
            {{ service }}
          </li>
        </ul>

      </div>

    </div>

  </div>

</section>
