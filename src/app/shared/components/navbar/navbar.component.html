
<nav class="navbar">
  <div class="navbar-container">

    <!-- Logo -->
    <div class="navbar-logo">
      <a routerLink="/" (click)="closeMenu()">
        <img
          src="assets/EgyptAirLogo.png"
          alt="EgyptAir Ground Services Logo"
          style="height: 45px; margin-right: 100px;"
        >
      </a>
    </div>

    <!-- Mobile Menu Icon -->
    <div
      class="menu-icon"
      [class.active]="menuOpen"
      (click)="toggleMenu()"
      role="button"
      tabindex="0"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="menuOpen"
      (keydown.enter)="toggleMenu()"
      (keydown.space)="$event.preventDefault(); toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Navigation Links -->
    <ul class="nav-menu" [class.active]="menuOpen">

      <li class="nav-item">
        <a
          class="nav-link"
          routerLink="/"
          (click)="closeMenu()"
        >
          Home
        </a>
      </li>

      <li class="nav-item">
        <a
          class="nav-link"
          (click)="scrollToServices()"
        >
          Services
        </a>
      </li>

      <li class="nav-item">
        <a
          class="nav-link"
          (click)="scrollToCustomers()"
        >
          Our Customers
        </a>
      </li>

      <li class="nav-item">
        <a
          class="nav-link"
          (click)="scrollToContact()"
        >
          Contact Us
        </a>
      </li>

 <li class="nav-item">
        <a
          class="nav-link"
          routerLink="/about-us"
          routerLinkActive="active-link"
          (click)="closeMenu()"
        >
          About Us
        </a>
      </li>

      <li class="nav-item">
        <a
          class="nav-link"
          routerLink="/feedback"
          (click)="closeMenu()"
        >
          Your Feedback
        </a>
      </li>

    </ul>
  </div>
</nav>
